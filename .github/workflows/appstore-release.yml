name: Submit App Store Release

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful ios candidate workflow run ID (dispatch from main)'
        required: true
        type: string
      confirm:
        description: 'Type "submit" to release this exact tested build'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release selection
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM" = submit
          python3 scripts/release_control.py select --platform ios --run-id "$BUILD_RUN"

      - name: Verify CI and frozen candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          python3 scripts/release_control.py ci --sha "$BUILD_SHA"
          SOURCE_JSON="$(cat release.json)" python3 scripts/release_control.py current

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Checkout the selected candidate's store listing
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
          path: .release-source
          persist-credentials: false

      - name: Submit the tested build for review with manual release
        working-directory: app/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          APP_VERSION: ${{ steps.build.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          APP_STORE_METADATA_PATH: ${{ github.workspace }}/.release-source/app/ios/fastlane/metadata
          APP_STORE_SCREENSHOTS_PATH: ${{ github.workspace }}/.release-source/app/ios/fastlane/screenshots
          GH_TOKEN: ${{ github.token }}
        run: |
          gem install fastlane --no-document
          export SOURCE_JSON="$(cat ../../release.json)"
          python3 ../../scripts/release_control.py current
          fastlane metadata
          python3 ../../scripts/release_control.py current
          fastlane release

      - uses: actions/upload-artifact@v4
        with:
          name: appstore-submission-${{ github.run_attempt }}
          path: release.json
          retention-days: 90
