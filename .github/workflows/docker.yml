name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "server/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# Keyed on the ref rather than the SHA for pushes: back-to-back merges must not
# race to publish `latest`, and cancelling the older run is what keeps the
# newest commit's image the one that wins.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing reaches GHCR until CI has passed on this exact commit. A pull
  # request is deliberately exempt: its build below is one of the PR's own
  # checks, and the pr-N preview image is meant to be pullable while the rest
  # of the checks are still running.
  gate:
    # The repo's default token is contents/packages read only, and a called
    # workflow can't request a scope its caller doesn't hold — so the scope
    # that reads another workflow's run status is granted here.
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/require-ci-green.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      enforce: ${{ github.event_name != 'pull_request' }}

  build:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the web bundle's build number is a commit count.
          fetch-depth: 0

      - name: Derive web build number
        id: app_build
        # Counts commits that touched app/, so Settings → About names the
        # bundle a deployment is running. Tied to app/ rather than the run
        # number so a rebuild of the same commit reports the same build and
        # server-only changes keep the cached Flutter layer.
        run: |
          echo "number=$(git rev-list --count HEAD -- app)" >> "$GITHUB_OUTPUT"

      - name: Derive build version
        id: version
        # Needs the same fetch-depth: 0 checkout as the build-number step
        # above (git describe wants the tags). Tag builds resolve to the exact
        # tag (v0.1.0); main/PR builds after a tag exists resolve to
        # v0.1.0-N-gSHA, which the server's update checker parses as 0.1.0 —
        # so the `latest` channel compares itself against releases and nags on
        # release cadence, not per merge. Before any v* tag this falls back to
        # a bare SHA and the checker stays dormant. --match keeps a future
        # non-version tag from hijacking the version and silently disabling
        # the checker.
        run: |
          echo "version=$(git describe --tags --always --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"

      # Every published channel — `latest` on main pushes as much as version
      # tags — is multi-arch, so arm64 deployments track the same updates as
      # amd64 ones. Only pr-N preview images stay amd64-only: they exist to be
      # poked at during review, and the emulated arm64 build would slow every
      # PR for an image nobody pulls on ARM.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/windoze95/cantinarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build published image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            APP_BUILD_NUMBER=${{ steps.app_build.outputs.number }}
          platforms: linux/amd64
          load: true
          push: false
          tags: cantinarr-root-smoke:${{ github.sha }}
          cache-from: type=gha,scope=published
          cache-to: type=gha,mode=max,scope=published

      - name: Verify published-image Codex runtime and notices
        run: |
          docker run --rm cantinarr-root-smoke:${{ github.sha }} sh -ec '
            test -x /usr/local/bin/codex-app-server
            test -s /usr/share/licenses/codex-app-server/LICENSE
            test -s /usr/share/licenses/codex-app-server/NOTICE
            /usr/local/bin/codex-app-server --help | grep -q -- --listen
          '

      - name: Verify the served web bundle carries the build number
        # End-to-end proof of the chain behind Settings → About: build arg →
        # `flutter build web --build-number` → version.json → embedded in the
        # binary → served. Dropping the arg from any build silently reverts
        # every deployment to pubspec's placeholder build 1.
        run: |
          docker run --rm -d --name cantinarr-version-smoke \
            -p 8585:8585 cantinarr-root-smoke:${{ github.sha }}
          served=""
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8585/version.json >/tmp/version.json \
              && { served=1; break; }
            sleep 1
          done
          [ -n "$served" ] || docker logs cantinarr-version-smoke
          docker rm -f cantinarr-version-smoke
          cat /tmp/version.json
          grep -q '"build_number":"${{ steps.app_build.outputs.number }}"' /tmp/version.json

      - name: Build arm64 published image for smoke test
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            APP_BUILD_NUMBER=${{ steps.app_build.outputs.number }}
          platforms: linux/arm64
          load: true
          push: false
          tags: cantinarr-root-arm64-smoke:${{ github.sha }}
          cache-from: type=gha,scope=published
          cache-to: type=gha,mode=max,scope=published

      - name: Verify arm64 Codex runtime and notices
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --platform linux/arm64 cantinarr-root-arm64-smoke:${{ github.sha }} sh -ec '
            test -x /usr/local/bin/codex-app-server
            test -s /usr/share/licenses/codex-app-server/LICENSE
            test -s /usr/share/licenses/codex-app-server/NOTICE
            /usr/local/bin/codex-app-server --help | grep -q -- --listen
          '

      - name: Build server-only image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          load: true
          push: false
          tags: cantinarr-server-smoke:${{ github.sha }}
          cache-from: type=gha,scope=server-only
          cache-to: type=gha,mode=max,scope=server-only

      - name: Verify server-only Codex runtime and notices
        run: |
          docker run --rm cantinarr-server-smoke:${{ github.sha }} sh -ec '
            test -x /usr/local/bin/codex-app-server
            test -s /usr/share/licenses/codex-app-server/LICENSE
            test -s /usr/share/licenses/codex-app-server/NOTICE
            /usr/local/bin/codex-app-server --help | grep -q -- --listen
          '

      - name: Build and push
        # Fork PRs run with a read-only GITHUB_TOKEN, so pushing the pr-N tag
        # is denied; the smoke-test builds above still prove both Dockerfiles.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            APP_BUILD_NUMBER=${{ steps.app_build.outputs.number }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=published
          cache-to: type=gha,mode=max,scope=published

  # The GitHub Release is what the server's update checker polls
  # (releases/latest) and where admins read what changed. It must
  # never precede the image it announces, so it waits on the publish job; the
  # gate already held everything until CI was green on this exact commit (a
  # v* tag reuses the CI verdict from the main push of the same commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Workflow re-runs must not fail on an already-created release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          # A -suffixed tag (v0.2.0-rc.1) is a prerelease: GitHub keeps it off
          # releases/latest, so the update check only ever sees stable releases.
          prerelease_flag=""
          case "$TAG" in *-*) prerelease_flag="--prerelease" ;; esac
          # This create is the last step of a release and the only one that needs
          # GitHub's own API healthy at that moment — the images are already in
          # GHCR by now. v0.2.0 burned two full runs here on a transient
          # `HTTP 503` from POST /releases, leaving published images that no
          # Release announced until someone re-ran the workflow by hand. Retry
          # across that kind of blip, re-checking existence each round so a
          # create that landed behind a failed response is recognized instead of
          # retried into an "already exists" error.
          for attempt in $(seq 1 6); do
            if gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              $prerelease_flag; then
              exit 0
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists after attempt ${attempt}; treating as created."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              delay=$((attempt * 30))
              echo "Release creation failed (attempt ${attempt}/6); retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Could not create the GitHub Release for ${TAG} after 6 attempts."
          exit 1
