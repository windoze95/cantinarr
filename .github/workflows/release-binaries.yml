name: Attach Release Binaries

# Native installs receive binaries extracted from the published multi-arch
# image by digest. No rebuild can change the bits after candidate testing.
#
# Runs on every v* tag push, and by hand to retry a release with retained CI
# evidence: dispatch from main with the tag name as input. It extracts the
# tag's published image and never replaces a different existing asset.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag whose published binaries should be attached"
        type: string
        required: true

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target tag and commit
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in v*) ;; *) echo "::error::'$tag' is not a v* tag"; exit 1 ;; esac
          sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Same rule as every shipping workflow: nothing is attached to a Release
  # until CI is green on the exact commit being shipped.
  gate:
    needs: [resolve]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/require-ci-green.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  binaries:
    needs: [resolve, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - name: Resolve the published image digest
        id: image
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          for _ in $(seq 1 30); do
            if docker buildx imagetools inspect "$image" > "$RUNNER_TEMP/image.txt"; then
              digest=$(sed -n 's/^Digest:[[:space:]]*//p' "$RUNNER_TEMP/image.txt" | head -1)
              test -n "$digest"
              echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${digest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo '::error::Published image did not become available'
          exit 1

      - name: Extract binaries and package tarballs
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p dist
          release_epoch=$(git show -s --format=%ct HEAD)
          # The classic Docker image store cannot retain two platforms under
          # one index digest. Resolve each child from the pinned index first.
          docker buildx imagetools inspect "$IMAGE" --raw > "$RUNNER_TEMP/release-index.json"
          for arch in amd64 arm64; do
            stage="dist/cantinarr-linux-${arch}"
            mkdir -p "$stage/licenses/codex-app-server"
            digest=$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 and (.[0] | test("^sha256:[a-f0-9]{64}$"))
                then .[0] else error("Expected exactly one valid Linux platform digest") end
            ' "$RUNNER_TEMP/release-index.json")
            platform_image="${IMAGE%@*}@${digest}"
            docker pull --platform "linux/${arch}" "$platform_image"
            revision=$(docker image inspect "$platform_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            test "$revision" = "$SHA"
            platform=$(docker image inspect "$platform_image" --format '{{.Os}}/{{.Architecture}}')
            test "$platform" = "linux/${arch}"
            cid=$(docker create --platform "linux/${arch}" "$platform_image")
            docker cp "$cid:/usr/local/bin/cantinarr" "$stage/cantinarr"
            docker cp "$cid:/usr/local/bin/codex-app-server" "$stage/codex-app-server"
            docker cp "$cid:/usr/share/licenses/codex-app-server/LICENSE" "$stage/licenses/codex-app-server/LICENSE"
            docker cp "$cid:/usr/share/licenses/codex-app-server/NOTICE" "$stage/licenses/codex-app-server/NOTICE"
            docker rm "$cid" >/dev/null
            cp LICENSE "$stage/LICENSE"
            chmod 0755 "$stage/cantinarr" "$stage/codex-app-server"
            printf '%s\n' \
              "Cantinarr server, linux/${arch}. The web app is embedded in the binary." \
              "" \
              "Quick start:" \
              "  install -m 0755 cantinarr codex-app-server /usr/local/bin/" \
              "  mkdir -p /config   # database + generated encryption key live here" \
              "  cantinarr" \
              "" \
              "Listens on 8585 (CANTINARR_PORT overrides). codex-app-server is the" \
              "optional ChatGPT-subscription runtime Cantinarr spawns from PATH." \
              > "$stage/INSTALL.txt"
            tar --sort=name --mtime="@${release_epoch}" --owner=0 --group=0 --numeric-owner \
              -cf - -C "$stage" . | gzip -n > "dist/cantinarr-linux-${arch}.tar.gz"
            (cd dist && sha256sum "cantinarr-linux-${arch}.tar.gz" > "cantinarr-linux-${arch}.tar.gz.sha256")
          done
          ls -la dist/*.tar.gz*

      - name: Smoke test the amd64 binary
        # The tarball must be self-sufficient on a plain filesystem: no image,
        # no entrypoint, just /config and the binary serving its embedded web
        # bundle. debian:stable-slim rather than scratch so the shell exists.
        run: |
          set -euo pipefail
          mkdir -p /tmp/binsmoke
          tar -xzf dist/cantinarr-linux-amd64.tar.gz -C /tmp/binsmoke
          docker run --rm -d --name cantinarr-bin-smoke \
            -v /tmp/binsmoke:/pkg:ro -p 18585:8585 \
            debian:stable-slim sh -ec 'mkdir -p /config && exec /pkg/cantinarr'
          ok=""
          for _ in $(seq 1 60); do
            curl -sf http://localhost:18585/api/health >/dev/null && { ok=1; break; }
            sleep 1
          done
          [ -n "$ok" ] || { docker logs cantinarr-bin-smoke; docker rm -f cantinarr-bin-smoke; exit 1; }
          curl -sf http://localhost:18585/version.json
          docker rm -f cantinarr-bin-smoke

      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # On a tag push this workflow races docker.yml, whose release job
          # owns creating the Release (after the images publish). Wait for it
          # rather than create a second owner. Existing assets are immutable;
          # deterministic packaging lets retries verify and skip equal bytes.
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
              verify_dir=$(mktemp -d)
              for file in dist/cantinarr-linux-*.tar.gz dist/cantinarr-linux-*.tar.gz.sha256; do
                name=$(basename "$file")
                if grep -Fxq "$name" "$RUNNER_TEMP/release-assets.txt"; then
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$verify_dir"
                  cmp "$file" "$verify_dir/$name" || { echo "::error::Published asset $name differs; refusing replacement"; exit 1; }
                else
                  gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
                fi
              done
              exit 0
            fi
            echo "Release $TAG not created yet (attempt ${attempt}/30); waiting 60s."
            sleep 60
          done
          echo "::error::Release $TAG never appeared; docker.yml's release job owns creating it."
          exit 1
