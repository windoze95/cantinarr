name: Require CI green

# GitHub has no `needs:` across workflows, so anything that ships calls this to
# hold its irreversible step — publishing an image to GHCR, uploading an IPA to
# TestFlight, uploading an AAB to Play — until the CI suite has finished green
# on the exact commit being shipped. Without it the shipping workflows and CI
# fire on the same `push` event and simply race: an upload that outruns the
# test suite ships an unproven commit, and a TestFlight build number burns
# permanently when it does.
#
# The gate always finds a run to wait for: `ci.yml` has no path filters, and
# main/release branch pushes have a CI run of their own. A `v*` tag reuses that
# evidence. Phone previews additionally verify the tested PR merge checkout,
# rather than trusting a green verdict associated only with the PR head SHA.

on:
  workflow_call:
    inputs:
      sha:
        description: >
          Exact checkout commit that CI must have tested successfully.
        type: string
        required: true
      ci-head:
        description: PR head SHA when sha is its tested merge checkout
        type: string
        default: ''
      enforce:
        description: >
          Set false for events that ship nothing (a PR's build-only checks), so
          the gate records that and returns instead of waiting.
        type: boolean
        default: true
      wait-minutes:
        description: How long to wait for CI to reach a conclusion.
        type: number
        default: 45

jobs:
  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Must stay within what the calling job grants — every caller hands this
    # exactly these two scopes.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Nothing ships from this event
        if: ${{ !inputs.enforce }}
        run: echo "This event publishes nothing, so it does not wait on CI."

      - uses: actions/checkout@v4
        if: ${{ inputs.enforce }}

      - name: Wait for evidence of the exact tested checkout
        if: ${{ inputs.enforce }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.sha }}
          CI_HEAD: ${{ inputs.ci-head || inputs.sha }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
        run: |
          python3 scripts/release_control.py ci --sha "$BUILD_SHA" \
            --ci-head "$CI_HEAD" --minutes "$WAIT_MINUTES"
