name: Deploy to TestFlight

on:
  push:
    branches: [main, 'release/**']
    paths:
      - "app/**"
      - "!app/web/**"
      - "!app/macos/**"
      - "!app/android/**"
      - "!app/windows/**"
      - "!app/linux/**"
      # Tests, dev tooling, and docs never change the shipped app — no build needed.
      - "!app/test/**"
      - "!app/tool/**"
      - "!app/**/*.md"
      # Listing copy/screenshots sync via storelisting.yml — no build needed.
      - "!app/ios/fastlane/metadata/**"
      - "!app/ios/fastlane/screenshots/**"
      - ".github/workflows/testflight.yml"
      - ".github/workflows/prepare-mobile.yml"
      - "scripts/release_control.py"
      - "scripts/testflight_distribute.py"
  workflow_call:
    inputs:
      preview_pr:
        type: string
        default: ''
      reviewed_sha:
        type: string
        default: ''
  workflow_dispatch:

# Serialize TestFlight runs. The build number is latest_testflight_build_number + 1,
# so two concurrent runs compute the SAME number and the second upload is rejected
# as a duplicate (ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE). Queue instead of racing,
# and never cancel an in-flight upload.
concurrency:
  group: testflight-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  source:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/prepare-mobile.yml
    with:
      preview_pr: ${{ inputs.preview_pr || '' }}
      reviewed_sha: ${{ inputs.reviewed_sha || '' }}

  # An upload is irreversible — it burns a build number and reaches testers —
  # so no IPA is built until CI has passed on this exact commit.
  gate:
    needs: [source]
    if: needs.source.outputs.enabled == 'true'
    # The repo's default token is contents/packages read only, and a called
    # workflow can't request a scope its caller doesn't hold — so the scope
    # that reads another workflow's run status is granted here.
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/require-ci-green.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      ci-head: ${{ needs.source.outputs.ci_head }}

  deploy:
    needs: [source, gate]
    if: needs.source.outputs.enabled == 'true' && needs.gate.result == 'success'
    environment: ${{ inputs.preview_pr && 'mobile-preview' || 'mobile-publishing' }}
    env:
      SOURCE_JSON: ${{ needs.source.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    runs-on: macos-26

    outputs:
      version: ${{ steps.build_number.outputs.version }}
      build_number: ${{ steps.build_number.outputs.build_number }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.source.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Checkout publishing tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-policy
          persist-credentials: false

      - name: Verify preview audience was configured
        if: inputs.preview_pr != '' && inputs.preview_pr != null
        env:
          PREVIEW_READY: ${{ vars.MOBILE_PREVIEW_READY }}
        run: test "$PREVIEW_READY" = 'true'

      - name: Calculate build number
        id: build_number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cd ios
          gem install fastlane
          APP_VERSION=$VERSION fastlane next_build_number

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/dist_cert.p12

          echo -n "$IOS_DIST_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/cantinarr.mobileprovision
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(/usr/bin/security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Configure signing
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          INTERNAL_ONLY: ${{ needs.source.outputs.channel == 'preview' }}
        run: |
          PP_PATH=$RUNNER_TEMP/cantinarr.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(/usr/bin/security cms -D -i "$PP_PATH")")
          TEAM_ID="2M54LKDR89"

          # Inject signing settings into Release.xcconfig
          {
            echo ""
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER=$UUID"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
          } >> ios/Flutter/Release.xcconfig

          # Generate ExportOptions.plist
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>testFlightInternalTestingOnly</key>
            <${INTERNAL_ONLY}/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>codes.julian.cantinarr</key>
              <string>${UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ipa --no-pub \
            --build-number=${{ steps.build_number.outputs.build_number }} \
            --build-name=${{ steps.build_number.outputs.version }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Recheck source before upload
        run: python3 ../.release-policy/scripts/release_control.py current

      - name: Upload to TestFlight
        env:
          BUILD_TEST_NOTES: ${{ format('{0} | PR {1} | commit {2}', needs.source.outputs.channel, inputs.preview_pr || 'merged', needs.source.outputs.sha) }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          cd ios
          fastlane beta

      - name: Record uploaded build identity
        working-directory: .
        env:
          BUILD_VERSION: ${{ steps.build_number.outputs.version }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: python3 .release-policy/scripts/release_control.py record --platform ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-record-${{ github.run_attempt }}
          path: release.json
          retention-days: 90

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  # The upload alone reaches nobody outside the team. The internal group was created with
  # automatic distribution and picks every build up on its own; external groups never do, so
  # without this job each build waits on someone opening App Store Connect to push it.
  #
  # It's a separate Linux job on purpose: fastlane can distribute inline, but only with
  # `skip_waiting_for_build_processing: false`, which holds a 10x-billed macOS runner for the
  # whole of Apple's processing. The tradeoff is that the `testflight-deploy` concurrency group
  # now stays held while this waits, so the poll is capped rather than open-ended — a stalled
  # Apple ingestion fails this job instead of blocking the next merge's build indefinitely.
  distribute:
    needs: [source, deploy]
    if: needs.source.outputs.channel != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      SOURCE_JSON: ${{ needs.source.outputs.source }}
      GH_TOKEN: ${{ github.token }}
      # The id addresses the group; the name is asserted against it before anything is
      # distributed, so a rename or a recreated group fails loudly instead of shipping a build
      # to an audience nobody chose.
      BETA_GROUP_ID: c0601f06-139f-4d1d-b95a-210f717af8b7
      BETA_GROUP_NAME: Public Beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install --quiet "pyjwt[crypto]>=2.8"

      - name: Recheck public beta ownership
        run: python3 scripts/release_control.py current

      - name: Distribute to external testers
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          python3 scripts/testflight_distribute.py \
            --group-id "$BETA_GROUP_ID" \
            --group-name "$BETA_GROUP_NAME" \
            --app-version "${{ needs.deploy.outputs.version }}" \
            --build-number "${{ needs.deploy.outputs.build_number }}" \
            --timeout-minutes 45
